<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Vampire Survivors 风格的修仙割草生存游戏" />

    <!-- PWA:装到主屏幕后按全屏应用跑,而不是浏览器里那个带地址栏的网页 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="献祭" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

    <title>献祭 - 吸血鬼幸存者风格 Roguelike</title>
    <link rel="stylesheet" href="./src/base.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div>请横屏游玩</div>
      <div class="sub">本作为横版Roguelike,竖屏无法正常战斗</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
